# poc_prostate 도메인 특화 프롬프트 조각.
#
# 실제 도메인 지식(일반 규칙 + 테이블별 노트)은 더 이상 이 파일이 아니라 app-db
# `domain_notes` 테이블에 있다 — 화면(도메인 관리 탭 → "도메인 노트" 팝업)에서 사용자가
# 등록/조회/수정하며, app/sql/prompt_builder.py의 load_general_notes()/load_table_notes()가
# 이 YAML(있다면)과 app-db 값을 합쳐서 읽는다. 2026-09-14에 이 파일에 있던 노트를 전부
# app-db로 이관했다(scratchpad/migrate_notes.py, 1회성 스크립트라 저장 안 함).
#
# 이 파일 자체는 비워둬도 정상 동작한다(app/sql/prompt_builder.py) — 다만 새 도메인을
# 연결할 때 개발 시점에 미리 몇 가지 규칙을 코드로 시딩해두고 싶으면 아래처럼 notes:/
# table_retrieval_hints: 키를 채워서 커밋해두는 용도로 계속 쓸 수 있다(app-db 값과 병합됨).
