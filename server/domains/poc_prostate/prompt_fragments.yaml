# poc_prostate 도메인 특화 프롬프트 조각 — 스모크테스트용 최소 버전.
# schema_provider의 컬럼 코멘트만으로는 드러나지 않는 "값 형식" 규칙만 남긴다.
# 도메인이 바뀌면 이 파일이 없어도 공통 템플릿만으로 정상 동작한다(app/sql/prompt_builder.py).
notes: |
  - 날짜 컬럼은 대부분 *_dt(TEXT, 'YYYYMMDD') 또는 occur_ym(TEXT, 'YYYYMM') 형식이다.
    비교/정렬 시 반드시 TO_DATE(col, 'YYYYMMDD') 또는 TO_DATE(col, 'YYYYMM')로 변환하라.
  - 이력 마트 3개 테이블(poc_prostate_op/path/blood)을 원천 테이블보다 우선 사용하라 —
    필요한 컬럼이 마트에 이미 있으면 원천 테이블과 JOIN하지 마라.
  - poc_prostate_patient_info는 이력 마트가 아니라 환자 단위 요약 코호트 테이블이다.
    op_nm/treat_desc_* 등 치료 관련 스냅샷 컬럼은 결측이 많거나(예: treat_desc_hormon은
    항상 NULL) 갱신되지 않을 수 있으므로, 수술/치료 상세 조건(수술 종류, 호르몬 치료 등)은
    이 스냅샷 컬럼을 쓰지 말고 반드시 원천 이력 테이블(수술은 poc_prostate_op, 호르몬
    치료 처방은 poc_ooodmordr 등)과 s_patno로 JOIN해서 확인하라.
  - s_patno(환자번호)는 명시적 요청이 없으면 SELECT에 노출하지 말고 COUNT(DISTINCT s_patno)
    같은 집계 용도로만 사용하라.
